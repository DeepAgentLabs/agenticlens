site_name: AgenticLens Documentation
site_url: https://deepagentlabs.io/agenticlens/docs/
site_description: Open-source observability, evaluation, and operational intelligence for production agentic AI systems.
repo_url: https://github.com/DeepAgentLabs/agenticlens
repo_name: DeepAgentLabs/agenticlens
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/agenticlens-logo.jpeg
  favicon: assets/agenticlens-logo.jpeg
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  patents/

# A page missing from nav fails the strict build
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Features: features.md
  - Configuration: configuration.md
  - API reference: api-reference.md
  - CLI reference: cli-reference.md
  - Integrations: integrations.md
  - Examples: examples.md
  - AIOS Validation and OTel: aios-validation-and-otel.md
  - Export formats: export-formats.md
  - RAG chunk utility: rag-chunk-utility.md
  - Trace and comparison: trace-and-comparison.md
  - Evaluation and release gates: evaluation-and-release-gates.md
  - Experiments and Statistical Comparison: experiments.md
  - Diagnosis and Failure Attribution: diagnosis.md
  - Multi-agent workflows: multi-agent-reference-workflows.md
  - Workflow schema spec: workflow-schema-spec.md
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Roadmap: roadmap.md
