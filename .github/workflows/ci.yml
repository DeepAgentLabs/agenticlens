name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

  regression-suite:
    # Runs an approved, hash-verified suite the way a team's CI would:
    # refuse altered versions, export, evaluate recorded outputs, then gate.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Verify approved suite versions
        run: uv run agenticlens suite verify --store examples/suites/store
      - name: Export the approved suite
        run: >
          uv run agenticlens suite export support-regression@1.0.0
          --store examples/suites/store --save build/regression-suite.json
      - name: Evaluate recorded outputs
        run: >
          uv run agenticlens evaluate build/regression-suite.json
          examples/suites/artifacts/samples.json
          --save build/evaluation.json --strict-evidence
      - name: Release gate
        run: uv run agenticlens gate build/evaluation.json --notify-state build/gate-state.json

  modelfit:
    # Replays the recorded four-model experiment and recommends a model per
    # task category; fails when any category has no model that meets its
    # hard constraints.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Run the recorded model-selection experiment
        run: >
          uv run agenticlens experiment run examples/modelfit/support-experiment.yaml
          examples/modelfit/support-suite.yaml --save build/experiment.json
      - name: Recommend models per task category
        run: >
          uv run agenticlens modelfit recommend build/experiment.json
          --config examples/modelfit/modelfit.yaml
          --manifest examples/modelfit/support-experiment.yaml
          --save build/modelfit.json --markdown build/modelfit.md
          --csv build/model-matrix.csv --fail-on-unfit
      - name: Show the task-level model matrix
        run: uv run agenticlens modelfit matrix build/modelfit.json

  optimization:
    # Analyses the recorded support-agent traces, records the adoption of tool
    # caching, and fails if quality regressed in the traces recorded afterwards.
    runs-on: ubuntu-latest
    needs: test
    env:
      OPPORTUNITY: tool_result_caching-412a72bac9f5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Analyse recorded traces
        run: >
          uv run agenticlens optimize analyze examples/optimization/traces/before
          --config examples/optimization/optimization.yaml --baseline-variant large
          --save build/optimization.json --markdown build/optimization.md
      - name: Record the adoption
        run: |
          for status in accepted adopted; do
            uv run agenticlens optimize decide build/optimization.json "$OPPORTUNITY" \
              --status "$status" --by ci --change "$GITHUB_SHA" --ledger build/ledger.jsonl
          done
      - name: Evaluate the outcome after adoption
        run: >
          uv run agenticlens optimize outcome build/optimization.json "$OPPORTUNITY"
          --before examples/optimization/traces/before
          --after examples/optimization/traces/after
          --ledger build/ledger.jsonl --fail-on-regression

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
      - name: Verify installed wheel execution evidence outside checkout
        run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" - <<'PY'
          from agenticlens.integrity import Coverage
          from agenticlens.integrity.execution import capture_execution, replay_execution
          from agenticlens.models.trace import Run
          key = b"CI-test-only-key-at-least-32-bytes"
          run = Run(run_id="installed-wheel", application_name="smoke")
          bundle = capture_execution(run, [], key_id="ci", key=key,
              coverage=Coverage(stream_id=run.run_id, description="empty CI capture", complete=True))
          restored, events = replay_execution(bundle, trusted_keys={"ci": key}, expected_run_id=run.run_id)
          assert restored == run and events == []
          from pathlib import Path
          from agenticlens.enterprise import EnterpriseStore, Project, StoragePolicy
          store = EnterpriseStore(Path("installed-enterprise.db"))
          project = Project(organization="ci", name="wheel")
          store.put_run(project, "ci", run, StoragePolicy())
          assert store.runs(project, StoragePolicy())[0] == run
          assert store.export_audit(project)["integrity"] == "not_verified"
          PY

  enterprise-readiness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev --python 3.12
      - name: Candidate contracts and offline example
        run: |
          uv run python scripts/generate_enterprise_schemas.py
          git diff --exit-code -- schemas/enterprise
          uv run python examples/enterprise_demo.py
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - name: Validate restricted deployment recipe
        run: |
          helm lint deploy/helm/agenticlens --set image=example/lens:test --set configSecret=lens-config
          helm template lens deploy/helm/agenticlens --set image=example/lens:test --set configSecret=lens-config > build-chart.yaml
