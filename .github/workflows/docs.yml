name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Build docs
        run: uv run --no-project --with "mkdocs-material>=9.5" mkdocs build --strict --site-dir site/docs

      - name: Add product website
        run: |
          cp index.html site/index.html
          cp site.css site/site.css
          cp site.js site/site.js
          if [ -f og.png ]; then cp og.png site/og.png; fi
          touch site/.nojekyll

      - name: Build and Package Use Cases in Connected Order
        run: |
          python scripts/build_usecases.py --site-dir site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
