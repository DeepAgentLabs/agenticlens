name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out shared documentation theme
        uses: actions/checkout@v4
        with:
          repository: DeepAgentLabs/deepagentlabs.github.io
          ref: main
          path: _docs-theme

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install docs dependencies
        run: uv sync --extra docs --python 3.12

      - name: Build docs
        run: uv run --no-project --with-requirements _docs-theme/scripts/docs-requirements.txt python _docs-theme/scripts/build_docs.py --project agenticlens --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/site/docs"

      - name: Add product website
        run: |
          cp index.html site/index.html
          cp site.css site/site.css
          cp site.js site/site.js
          cp og.png site/og.png
          touch site/.nojekyll

      - name: Check rendered documentation
        run: python3 _docs-theme/scripts/check_docs_site.py site/docs

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
