name: Multi-agent support workflow
version: "1.0"
description: Release criteria for the offline LangGraph supervisor demonstration.
cases:
  - id: regional-case-total
    name: Calculate the combined resolved case count
    input: How many support cases were resolved across both regions?
    expected_contains:
      - combined number of resolved cases
      - "42"
    required_tools:
      - add
    forbidden_tools:
      - external_network
    max_latency_ms: 2000
    tags:
      - multi-agent
      - deterministic
