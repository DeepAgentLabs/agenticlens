name: support-regression
version: 1.0.0
cases:
- id: refund-policy
  name: Refund policy
  input: How do I get a refund? My email is [EMAIL]
  expected_contains:
  - 30 days
  required_tools:
  - lookup_policy
  tags:
  - smoke
  metadata:
    source:
      kind: imported
      file: support_cases.csv
      row: 1
    domain: billing
    split: train
