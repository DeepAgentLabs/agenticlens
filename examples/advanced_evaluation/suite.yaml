name: refund-rag-advanced
version: "1.0"
description: >
  Trace-aware checks for a RAG support agent: trajectory, groundedness against
  retrieved documents, valid citations, no PII in output or tool arguments,
  and no tool loops. All evaluators here are deterministic; see
  examples/advanced_evaluation_demo.py for adding a structured LLM judge.
cases:
  - id: grounded
    name: Grounded answer with a valid citation
    input: When will my refund arrive and where will it go?
    evaluators: &checks
      - name: tool_trajectory
        config: {expected: [kb_search, lookup_order], mode: in_order}
      - name: groundedness
      - name: citation
      - name: safety
      - name: loop
  - id: ungrounded
    name: Answer invents a policy and cites an unknown document
    input: When will my refund arrive and where will it go?
    evaluators: *checks
  - id: leaky
    name: Answer is fine but a tool call carried the customer's email
    input: When will my refund arrive and where will it go?
    evaluators: *checks
